# Sonar project for ima-jin/links — SONAR_TOKEN is expected to be an org
# secret shared with ima-jin/dykil and ima-jin/imajin-app-template; a repo
# admin must additionally create this project on sonarcloud.io if it does
# not already exist (see .github/workflows/sonarcloud.yml).
sonar.organization=ima-jin
sonar.projectKey=ima-jin_links
# SonarCloud has no "rename project" UI action — the display name is only
# ever set by whatever analysis run first creates the project, and stays
# whatever the LATEST analysis sends. Setting it explicitly here (rather
# than letting it default to the project key) is the only way to control it.
sonar.projectName=links

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is not required for: build/config files (not app logic), React UI
# shells (layout/page/providers/not-found — presentational), drizzle
# schema/db wiring (exercised against a real Postgres instance, not
# unit-testable without one), and the test files themselves (vitest's own
# coverage.exclude already omits them from lcov.info, so without this they'd
# be measured as 0% covered rather than skipped). Every route under app/api
# and every module under src/lib is unit tested and counted normally.
sonar.coverage.exclusions=**/*.config.js,**/*.config.mjs,**/*.config.ts,**/__tests__/**,**/*.test.ts,instrumentation.ts,app/layout.tsx,app/page.tsx,app/claim/page.tsx,app/providers.tsx,app/not-found.tsx,app/globals.css,app/dashboard/page.tsx,app/edit/page.tsx,app/[handle]/**,src/components/**,src/db/**,scripts/**
